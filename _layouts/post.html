---
layout: default
---
<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%b %d, %Y' }}</time>
      {% for tag in page.tags %}<span class="badge">{{ tag }}</span>{% endfor %}
    </div>
    <p class="cmd">cat _posts/{{ page.date | date: '%Y-%m-%d' }}-{{ page.title | slugify }}.md</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a href="{{ '/blog/' | relative_url }}">all posts</a>
  </footer>
</article>
