<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">carlok</a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}" class="{% if page.section == 'home' %}active{% endif %}">home</a>
        <a href="{{ '/projects/' | relative_url }}" class="{% if page.section == 'projects' %}active{% endif %}">projects</a>
        <a href="{{ '/blog/' | relative_url }}" class="{% if page.section == 'blog' %}active{% endif %}">blog</a>
        <a href="{{ '/writing/' | relative_url }}" class="{% if page.section == 'writing' %}active{% endif %}">writing</a>
        <a href="{{ '/cv/' | relative_url }}" class="{% if page.section == 'cv' %}active{% endif %}">cv</a>
        <a href="https://carlok.github.io/LeanFrontier/" class="external">leanfrontier ↗</a>
      </nav>
    </div>
  </header>

  <main class="container content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer">
      <span>
        <a href="https://github.com/carlok">github.com/carlok</a>
        ·
        <a href="https://carlo.perassi.com/">carlo.perassi.com</a>
        ·
        <a href="https://carlok.github.io/LeanFrontier/">LeanFrontier</a>
      </span>
      <span>exit code 0</span>
    </div>
  </footer>
</body>
</html>
