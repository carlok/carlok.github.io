<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">Carlo&nbsp;Perassi</a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}" class="{% if page.section == 'home' %}active{% endif %}">Home</a>
        <a href="{{ '/projects/' | relative_url }}" class="{% if page.section == 'projects' %}active{% endif %}">Projects</a>
        <a href="{{ '/writing/' | relative_url }}" class="{% if page.section == 'writing' %}active{% endif %}">Writing</a>
        <a href="{{ '/blog/' | relative_url }}" class="{% if page.section == 'blog' %}active{% endif %}">Blog</a>
        <a href="https://carlok.github.io/LeanFrontier/" class="external">LeanFrontier&nbsp;↗</a>
      </nav>
    </div>
  </header>

  <main class="container content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer">
      <span>© {{ site.time | date: '%Y' }} Carlo Perassi</span>
      <span class="footer-links">
        <a href="https://github.com/carlok">github.com/carlok</a>
        <a href="https://carlo.perassi.com/">carlo.perassi.com</a>
        <a href="https://carlok.github.io/LeanFrontier/">LeanFrontier</a>
      </span>
    </div>
  </footer>
</body>
</html>
